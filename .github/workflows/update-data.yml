name: Update card data

# Refreshes data/riftbound-cards.js once a day, after TCGCSV publishes its daily
# snapshot of TCGplayer's catalog (around 20:00 UTC). Scheduled runs only happen
# on the repository's default branch. Run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Riftbound cards and prices
        run: python3 scripts/update_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "Card data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Riftbound card data"
          git push
